[project]
name = "cellxhaustive"
version = "1.0.0"
description = "A Python package for performing an exhaustive search of cell phenotypes"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Antonin Thiébaut", email = "antonin.thiebaut57@gmail.com" },
    { name = "Bernat Bramon Mora", email = "bernat.bramon@gmail.com" },
    { name = "Arthur Vincens", email = "arthur.dev28@gmail.com" }
]
maintainers = [
    { name = "Antonin Thiébaut", email = "antonin.thiebaut57@gmail.com" }
]
keywords = ["cell annotations", "cite-seq", "single cell"]
dynamic = [ "classifiers" ]
dependencies = [
    "numpy (>=2.0.1, <3.0.0)",
    "pandas (>=2.2.2, <3.0.0)",
    "pathos (>=0.3.2, <0.4.0)",
    "pyyaml (>=6.0.1, <7.0.0)",
    "scikit-learn (>=1.5.1, <2.0.0)",
    "scipy (>=1.13.1)"
]

[project.urls]
homepage = "https://github.com/bdsc-tds/cellxhaustive/"
repository = "https://github.com/bdsc-tds/cellxhaustive/"
documentation = "https://github.com/bdsc-tds/cellxhaustive/blob/main/README.md"
Changelog = "https://github.com/bdsc-tds/cellxhaustive/blob/main/CHANGELOG.md"
"Code of Conduct" = "https://github.com/bdsc-tds/cellxhaustive/blob/main/CONDUCT.md"
Contributing = "https://github.com/bdsc-tds/cellxhaustive/blob/main/CONTRIBUTING.md"

[project.scripts]
cellxhaustive = "cellxhaustive.cellxhaustive:main"

[tool.poetry]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: MacOS",
    "Operating System :: Microsoft",
    "Operating System :: Unix"
]
packages = [
    { include = "cellxhaustive", from = "src" }
]
include = ["CHANGELOG.md", "CONDUCT.md", "CONTRIBUTING.md", "LICENSE", "README.md"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
